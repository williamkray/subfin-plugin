name: Release

# Tag v10.11.X.Y (created by scripts/release.sh) → builds the plugin for every supported
# Jellyfin line from the same source, attaches one zip per line to a single GitHub Release,
# and adds one manifest entry per line. Jellyfin installs the highest version whose targetAbi
# it supports, so 10.11 servers get 10.11.X.Y and 12.x servers get 12.0.X.Y.

on:
  push:
    tags:
      - 'v*.*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (Jellyfin ${{ matrix.jellyfin }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - jellyfin: '10.11'
            dotnet: '9.0.x'
            tfm: net9.0
            abi: '10.11'
          - jellyfin: '12'
            dotnet: '10.0.x'
            tfm: net10.0
            abi: '12.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"                       # e.g. 10.11.5.8
          SUBFIN_VERSION=$(echo "$TAG" | cut -d. -f3-4)     # e.g. 5.8
          CSPROJ_VERSION=$(sed -n 's|.*<SubfinVersion>\(.*\)</SubfinVersion>.*|\1|p' Jellyfin.Plugin.Subsonic/Jellyfin.Plugin.Subsonic.csproj)
          if [ "$SUBFIN_VERSION" != "$CSPROJ_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies plugin version $SUBFIN_VERSION but the csproj has $CSPROJ_VERSION. Use scripts/release.sh."
            exit 1
          fi
          echo "SUBFIN_VERSION=$SUBFIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=${{ matrix.abi }}.$SUBFIN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test -p:JellyfinTarget=${{ matrix.jellyfin }} --nologo

      - name: Publish
        run: dotnet publish -c Release Jellyfin.Plugin.Subsonic -p:JellyfinTarget=${{ matrix.jellyfin }} --nologo -v quiet

      - name: Package ZIP
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PUBLISH="Jellyfin.Plugin.Subsonic/bin/Release/${{ matrix.tfm }}/publish"
          WORK_DIR=$(mktemp -d)
          ZIP_NAME="jellyfin-plugin-subfin_${VERSION}.zip"

          # Sanity check: the built assembly carries the expected version
          ASM_VERSION=$(strings -el "$PUBLISH/Jellyfin.Plugin.Subsonic.dll" | grep -m1 -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ "$ASM_VERSION" != "$VERSION" ]; then
            echo "::error::Assembly version '$ASM_VERSION' does not match expected '$VERSION'"
            exit 1
          fi

          jq --arg version "$VERSION" \
             --arg targetAbi "${{ matrix.abi }}.0.0" \
             --arg timestamp "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
             --arg imageUrl "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/logo.png" \
             '. + {version: $version, targetAbi: $targetAbi, timestamp: $timestamp, imageUrl: $imageUrl,
                   status: "Active", autoUpdate: true, assemblies: ["Jellyfin.Plugin.Subsonic.dll"]}
              | del(.changelog)' meta.json > "$WORK_DIR/meta.json"

          cp "$PUBLISH/Jellyfin.Plugin.Subsonic.dll" "$WORK_DIR/"
          (cd "$WORK_DIR" && zip -q "$ZIP_NAME" meta.json Jellyfin.Plugin.Subsonic.dll)
          mkdir -p dist && cp "$WORK_DIR/$ZIP_NAME" dist/

          # Per-target manifest fragment, merged by the release job
          jq -n --arg version "$VERSION" --arg targetAbi "${{ matrix.abi }}.0.0" \
                --arg checksum "$(md5sum "dist/$ZIP_NAME" | awk '{print $1}')" \
                --arg zip "$ZIP_NAME" \
                '{version: $version, targetAbi: $targetAbi, checksum: $checksum, zip: $zip}' \
                > "dist/entry-${{ matrix.abi }}.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.abi }}
          path: dist/

  release:
    name: Publish release + manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RAW_LOG=$(git log --oneline --no-merges "${PREV_TAG}..HEAD" 2>/dev/null || echo "")
          else
            RAW_LOG=$(git log --oneline --no-merges -20 2>/dev/null || echo "")
          fi
          {
            echo 'CHANGELOG<<EOF'
            echo "$RAW_LOG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ steps.changelog.outputs.CHANGELOG }}
        run: |
          NOTES=$(printf '%s\n\nAssets: one zip per Jellyfin line (10.11.x → 10.11.*, 12.x → 12.0.*). Installing via the plugin repository picks the right one automatically.\n' "$CHANGELOG")
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$NOTES" dist/*.zip

      - name: Update manifest
        env:
          CHANGELOG: ${{ steps.changelog.outputs.CHANGELOG }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          IMAGE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/logo.png"

          NEW_ENTRIES=$(jq -s --arg changelog "$CHANGELOG" --arg ts "$TIMESTAMP" --arg base "$BASE_URL" \
            'map({checksum, changelog: $changelog, targetAbi, sourceUrl: ($base + "/" + .zip), timestamp: $ts, version})
             | sort_by(.targetAbi | split(".") | map(tonumber)) | reverse' dist/entry-*.json)

          EXISTING=$(jq '.[0].versions // []' jellyfin-plugin-subfin-manifest.json 2>/dev/null || echo "[]")
          VERSIONS=$(jq -n --argjson new "$NEW_ENTRIES" --argjson old "$EXISTING" \
            '($new | map(.version)) as $vs | $new + ($old | map(select(.version as $v | $vs | index($v) | not)))')

          jq -n \
            --arg category "$(jq -r '.category' meta.json)" \
            --arg description "$(jq -r '.description' meta.json)" \
            --arg guid "$(jq -r '.guid' meta.json)" \
            --arg imageUrl "$IMAGE_URL" \
            --arg overview "$(jq -r '.overview' meta.json)" \
            --arg owner "$(jq -r '.owner' meta.json)" \
            --argjson versions "$VERSIONS" \
            '[{category: $category, description: $description, guid: $guid, imageUrl: $imageUrl, name: "Subfin", overview: $overview, owner: $owner, versions: $versions}]' \
            > jellyfin-plugin-subfin-manifest.json

          jq -c '.[0].versions[0:3][] | {version, targetAbi, sourceUrl}' jellyfin-plugin-subfin-manifest.json

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jellyfin-plugin-subfin-manifest.json
          git commit -m "release: update manifest for ${GITHUB_REF_NAME} [skip ci]"
          git push origin HEAD:main
